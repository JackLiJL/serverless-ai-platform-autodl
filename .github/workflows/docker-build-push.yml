name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  INFERENCE_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/inference-service
  MONITORING_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/prometheus
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set build tag
        run: echo "TAG=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build and push inference service image
        uses: docker/build-push-action@v5
        with:
          context: ./inference-service
          push: true
          tags: ${{ env.INFERENCE_IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Prometheus image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          push: true
          tags: ${{ env.MONITORING_IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
