name: Test, Build, and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  INFERENCE_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/inference-service
  MONITORING_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/prometheus
  DOCKER_BUILDKIT: 1
  TF_VAR_grafana_url: ${{ secrets.GRAFANA_URL }}
  TF_VAR_grafana_token: ${{ secrets.GRAFANA_TOKEN }}
  TF_VAR_prometheus_datasource_uid: ${{ secrets.PROMETHEUS_DATASOURCE_UID }}

jobs:
  # ── 1. Unit tests ─────────────────────────────────────────────────────────────
  # Runs before any image build so broken code fails fast.
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inference-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest app/tests -m unit -v

  # ── 2. Build container + integration tests ───────────────────────────────────
  # Builds the image locally, runs it, then executes integration tests against it.
  build-and-integration:
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inference-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build inference-service image (local only, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./inference-service
          load: true                # load into local Docker daemon
          tags: inference-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start inference service container
        run: |
          docker run -d \
            --name inference-test \
            -p 8000:8000 \
            -e MODEL_NAME=Qwen3-0.6B \
            inference-service:test

      - name: Install integration test dependencies
        run: pip install pytest requests

      - name: Wait for service to be ready
        run: |
          echo "Waiting for inference service (model download may take several minutes)..."
          for i in $(seq 1 300); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Service ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "--- Container logs ---"
          docker logs inference-test 2>&1 || true
          echo "Service not ready within 600s"
          exit 1

      - name: Run integration tests
        run: pytest integration/ -m integration -v

      - name: Clean up container
        if: always()
        run: |
          docker stop inference-test 2>/dev/null || true
          docker rm inference-test 2>/dev/null || true

  # ── 3. Push images ────────────────────────────────────────────────────────────
  # Only on main and only after all tests pass.
  push:
    needs: [unit-tests, build-and-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set build tag
        run: echo "TAG=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Build and push inference service image
        uses: docker/build-push-action@v5
        with:
          context: ./inference-service
          push: true
          tags: ${{ env.INFERENCE_IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Prometheus image
        uses: docker/build-push-action@v5
        with:
          context: ./monitoring
          push: true
          tags: ${{ env.MONITORING_IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── 4. Terraform ──────────────────────────────────────────────────────────────
  terraform-plan-and-apply:
    needs: push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./terraform
    env:
      # R2 S3-compatible credentials — mapped to the AWS env vars that
      # the Terraform S3 backend reads during `terraform init`.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
